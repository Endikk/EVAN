# Broker EVAN : TLS obligatoire et authentification mutuelle par certificat client.
# Le nom d'utilisateur MQTT est le CN du certificat (api, simulator, tours-01…), utilisé par les ACL.
# Un seul listener : allow_anonymous et acl_file sont globaux (per_listener_settings est déprécié en 2.1).
allow_anonymous false
acl_file /mosquitto/config/acl

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type notice
