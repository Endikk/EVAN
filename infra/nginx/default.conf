# Front EVAN (fichiers statiques) + relais vers l'API, le hub SignalR et le serveur MCP.

# Ce qui précède nginx : rien en local (relais.conf, port 8088 en clair), Caddy en HTTPS une fois en ligne
# (relais-tls.conf, monté à sa place par docker-compose.prod.yml). Définit $evan_proto, le protocole d'origine, et dit
# quand croire l'adresse du client annoncée par X-Forwarded-For.
include /etc/nginx/evan/relais.conf;

# L'API est résolue par le DNS de Docker à l'exécution, pas une fois au démarrage : nginx démarre même si l'API n'est
# pas encore là (le front bascule alors sur le simulateur du navigateur) et suit sa nouvelle adresse quand le conteneur
# est recréé, au lieu de répondre 502 jusqu'au prochain redémarrage de nginx. Connexions gardées ouvertes vers l'API.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream evan_api {
    zone evan_api 64k;
    server api:8080 resolve;
    keepalive 16;
}

# WebSocket (SignalR) : en-tête Upgrade relayé ; sinon Connection vide, pour réutiliser la connexion vers l'API.
map $http_upgrade $evan_connection {
    default upgrade;
    ''      '';
}

# Limites par adresse du client, en amont de celles de l'API (code d'accès, concurrence, quota du jour) :
# questions à l'assistant (appel payant au modèle) et requêtes MCP. Seul le POST de l'assistant compte : la
# vérification de disponibilité (GET) reste libre.
map $request_method $evan_question {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $evan_question       zone=evan_assistant:10m rate=6r/m;
limit_req_zone $binary_remote_addr  zone=evan_mcp:10m       rate=120r/m;

# Écritures anonymes de l'API (acquittements, interventions, événements, pannes de démo) : débit borné par client,
# pour qu'une boucle ne remplisse ni la mémoire ni la base. Les lectures (GET) ne comptent pas.
map $request_method $evan_ecriture {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $evan_ecriture       zone=evan_ecritures:10m rate=60r/m;

# Mise en cache selon le chemin, posée au niveau du serveur : un add_header dans un location effacerait les en-têtes
# de sécurité du serveur pour ce location.
map $uri $evan_cache {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/kit/modeles/     "public, max-age=86400";
    ~^/parcours/        "public, max-age=86400";
    # Toujours revalidée : après un déploiement, le navigateur charge les nouveaux noms de fichiers de /assets/ au
    # lieu d'un index.html en cache qui pointe vers des fichiers supprimés.
    /index.html         "no-cache";
    default             "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # En-têtes de sécurité, sur toutes les réponses. La politique de contenu n'autorise que les services de cartes et
    # de recherche réellement appelés par le front ; le script en ligne de index.html (thème appliqué avant le premier
    # rendu) est autorisé par son empreinte, vérifiée par src/EVAN.Front/src/app/csp.test.ts. 'wasm-unsafe-eval' laisse
    # compiler le décodeur WebAssembly des modèles 3D (Meshopt, via drei) sans autoriser eval() pour le JavaScript.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-EF7QxZ1VBq5ims/kg0u5rayAxKNofu7vBlR4rxnt/6c='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://data.geopf.fr https://server.arcgisonline.com https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' blob: data: https://data.geopf.fr https://server.arcgisonline.com https://tiles.openfreemap.org https://rnb.beta.gouv.fr https://recherche-entreprises.api.gouv.fr https://photon.komoot.io https://overpass.private.coffee https://overpass-api.de; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Outil interne d'une entreprise : rien à indexer, même si un lien fuit (robots.txt n'est qu'une demande).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $evan_cache;

    # Fichiers du build précompressés en gzip -9 (voir front.Dockerfile) ; compression à la volée pour le reste (API).
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # En-têtes communs à tous les relais. Un location qui pose son propre proxy_set_header perd toute cette liste :
    # n'en ajouter qu'ici.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $evan_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Protocole vu par le navigateur (https derrière Caddy), pas celui du dernier saut.
    proxy_set_header X-Forwarded-Proto $evan_proto;

    # Assistant « Demander à EVAN » : réponse en flux (SSE), requête bornée, débit limité. Insensible à la casse et à
    # la barre finale, comme le routage de l'API : /api/Assistant/ ne contourne pas la limite.
    location ~* ^/api/assistant/?$ {
        limit_req zone=evan_assistant burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        proxy_pass http://evan_api;
        proxy_buffering off;
        proxy_read_timeout 5m;
    }

    # Configuration complète d'une usine (PUT /api/sites/{id}) : l'usine d'exemple pèse déjà 85 ko, l'API en accepte
    # 4 Mo sur cette route seule. Même limite de débit que les autres écritures ; l'API exige un compte pour écrire.
    location ~* ^/api/sites/[^/]+/?$ {
        limit_req zone=evan_ecritures burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        proxy_pass http://evan_api;
    }

    location /api/ {
        limit_req zone=evan_ecritures burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://evan_api;
    }

    # Serveur MCP (Streamable HTTP) : Claude Desktop, Claude Code ou une autre application cliente MCP.
    # Accès réseau : code d'accès (EVAN_CODE_ACCES) en Authorization: Bearer, vérifié par l'API.
    location /mcp {
        limit_req zone=evan_mcp burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        proxy_pass http://evan_api;
        proxy_buffering off;
        proxy_read_timeout 5m;
    }

    location /hubs/ {
        proxy_pass http://evan_api;
        proxy_read_timeout 1h;
    }

    # Manifeste de l'application (nom, couleurs, icônes) : extension absente du mime.types de nginx.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location /kit/modeles/ {
        types { model/gltf-binary glb; }
    }

    location /assets/ {
        # Worker MapLibre en module (.mjs) : absent du mime.types de nginx, il partirait en octet-stream et le
        # navigateur refuserait de le charger (carte sans tuiles).
        include mime.types;
        types { application/javascript mjs; }
    }

    location / {
        try_files $uri /index.html;
    }
}
