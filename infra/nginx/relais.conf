# Ce qui précède nginx, inclus par default.conf. Ici, le cas par défaut : nginx reçoit lui-même les navigateurs (port
# 8088, en clair), donc aucun en-tête X-Forwarded-* envoyé par un client n'est cru. Le protocole transmis à l'API est
# celui de la connexion, l'adresse du client celle de la connexion.
# La mise en ligne (docker-compose.prod.yml) remplace ce fichier par relais-tls.conf : Caddy devant, en HTTPS.
map $scheme $evan_proto {
    default $scheme;
}
