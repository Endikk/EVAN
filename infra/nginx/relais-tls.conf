# Mise en ligne : Caddy (proxy TLS) devant nginx. Monté par docker-compose.prod.yml à la place de relais.conf.
# nginx n'y publie plus aucun port : seuls les conteneurs de la pile l'atteignent, et Caddy remplace les en-têtes
# X-Forwarded-For et X-Forwarded-Proto qu'un client enverrait. Les réseaux privés (ceux de Docker) sont donc crus.

# Adresse du client : la dernière de X-Forwarded-For, celle que Caddy a posée. Les limites par adresse de nginx
# (limit_req) et de l'API (dernière adresse de X-Forwarded-For) restent par client au lieu de toutes porter sur Caddy ;
# le journal d'accès montre le vrai client.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Protocole d'origine annoncé par Caddy (https), transmis à l'API.
map $http_x_forwarded_proto $evan_proto {
    default $scheme;
    https   https;
}
